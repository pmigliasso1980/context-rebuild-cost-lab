[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "startup-readiness"
version = "0.1.0"
description = "A tiny, dependency-free startup-readiness checker"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
readiness-check = "readiness.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

